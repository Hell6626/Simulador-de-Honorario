# ---------------------------------------------
# Simulador de Propostas
server {
    listen 80;
    server_name propostas.christinocontabilidade.com.br www.propostas.christinocontabilidade.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    return 301 https://propostas.christinocontabilidade.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    server_name propostas.christinocontabilidade.com.br www.propostas.christinocontabilidade.com.br;

    ssl_certificate /etc/letsencrypt/live/propostas.christinocontabilidade.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propostas.christinocontabilidade.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Redirect www to non-www
    if ($host = www.propostas.christinocontabilidade.com.br) {
        return 301 https://propostas.christinocontabilidade.com.br$request_uri;
    }

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    client_max_body_size 128M;

    # API Backend - todas as rotas que começam com /api/
    location /api/ {
        proxy_pass http://127.0.0.1:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        
        # CORS headers para API
        add_header 'Access-Control-Allow-Origin' 'https://propostas.christinocontabilidade.com.br' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:5002/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend React App - todas as outras rotas
    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }

    error_page 502 503 504 /502.html;
    location = /502.html {
        root /var/www/html;
        internal;
    }
}
